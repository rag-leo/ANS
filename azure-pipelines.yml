# Triggered by pushes to Azure Repos main (company deployment policy —
# this repo's canonical source for deployment is Azure Repos, not
# GitHub). Builds one backend image (serves both the Container App and
# the ingestion Container App Job) and deploys the frontend to App
# Service separately as native Python (no Selenium/Chrome dependency
# there — see frontend/requirements.txt).
#
# The image is built via ACR Tasks (`az acr build`) rather than a
# Docker@2 task — the build runs server-side in ACR itself, so no
# Docker daemon is needed on the pipeline agent (company build
# machines don't have Docker installed).
#
# Resource names below point at the DF-RAGAPP resource group.
# containerAppJobName (dfragappcaj01) must be created before this
# pipeline's DeployIngestionJob stage can succeed — it isn't
# provisioned by this pipeline. azureSubscription must be created as
# an Azure DevOps service connection (Azure Resource Manager type,
# service principal scoped to DF-RAGAPP-RG) with AcrPush rights on
# dfragappacr01 and update rights on the Container App / Job / App
# Service, before the first run.

trigger:
  branches:
    include:
      - main

variables:
  acrName: 'dfragappacr01'
  imageRepository: 'ans-backend'
  containerRegistry: '$(acrName).azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  resourceGroup: 'DF-RAGAPP-RG'
  containerAppName: 'dfragappca01'
  containerAppJobName: 'dfragappcaj01'
  webAppName: 'dfragapp01'
  # Azure DevOps service connection with rights on the subscription —
  # its service principal needs AcrPush (or Contributor) on the
  # registry itself, since it now drives `az acr build` directly
  # instead of a separate Docker-registry-scoped service connection.
  azureSubscription: 'DF-RAGAPP-ARM-SC'

stages:

  - stage: Build
    displayName: Build backend image via ACR Tasks
    jobs:
      - job: BuildImage
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: az acr build
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr build \
                  --registry $(acrName) \
                  --resource-group $(resourceGroup) \
                  --image $(imageRepository):$(tag) \
                  --image $(imageRepository):latest \
                  --file $(dockerfilePath) \
                  $(Build.SourcesDirectory)

  - stage: DeployBackend
    displayName: Deploy backend Container App
    dependsOn: Build
    jobs:
      - deployment: DeployContainerApp
        pool:
          vmImage: ubuntu-latest
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Update Container App image
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az containerapp update \
                        --name $(containerAppName) \
                        --resource-group $(resourceGroup) \
                        --image $(containerRegistry)/$(imageRepository):$(tag)

  - stage: DeployIngestionJob
    displayName: Update ingestion Container App Job image
    dependsOn: Build
    jobs:
      - deployment: DeployJob
        pool:
          vmImage: ubuntu-latest
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Update Container App Job image
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az containerapp job update \
                        --name $(containerAppJobName) \
                        --resource-group $(resourceGroup) \
                        --image $(containerRegistry)/$(imageRepository):$(tag)
                      # The job's command (`python -m backend.data.pipeline`)
                      # and its cron schedule are configured once on the Job
                      # resource itself (portal or `az containerapp job
                      # create`), not re-set on every deploy here — this step
                      # only refreshes which image the job runs.

  - stage: DeployFrontend
    displayName: Deploy frontend to App Service
    dependsOn: Build
    jobs:
      - deployment: DeployWebApp
        pool:
          vmImage: ubuntu-latest
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: ArchiveFiles@2
                  displayName: Archive frontend/
                  inputs:
                    rootFolderOrFile: '$(Build.SourcesDirectory)/frontend'
                    includeRootFolder: false
                    archiveType: zip
                    archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'
                - task: AzureWebApp@1
                  displayName: Deploy to App Service
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appType: webAppLinux
                    appName: '$(webAppName)'
                    package: '$(Build.ArtifactStagingDirectory)/frontend.zip'
                    startUpCommand: 'bash startup.sh'

# Database migrations (alembic upgrade head) are deliberately NOT run
# automatically on every push here — see README.md's "Running
# migrations" section for the manual, explicit invocation pattern
# (a separate, manually-triggered Container App Job using this same
# image). Auto-running migrations on every deploy risks concurrent
# migration races and makes an accidental bad push harder to reason
# about.
